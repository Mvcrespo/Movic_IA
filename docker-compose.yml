name: pulse

services:
  gateway:
    image: ghcr.io/mvcrespo/movic-gateway:latest
    build:
      context: .
      dockerfile: discord/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8000}
      DASHBOARD_SERVICE_URL: ${DASHBOARD_SERVICE_URL:-http://dashboard-service:8088}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8088}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      DASHBOARD_CONFIG_CACHE_MS: ${DASHBOARD_CONFIG_CACHE_MS:-3000}
      DISCORD_GATEWAY_INTERNAL_PORT: ${DISCORD_GATEWAY_INTERNAL_PORT:-8010}
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped

  telegram-gateway:
    image: ghcr.io/mvcrespo/movic-telegram-gateway:latest
    profiles:
      - telegram
    build:
      context: .
      dockerfile: telegram/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://orchestrator:8000}
      DASHBOARD_SERVICE_URL: ${DASHBOARD_SERVICE_URL:-http://dashboard-service:8088}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8088}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
      TELEGRAM_GATEWAY_INTERNAL_PORT: ${TELEGRAM_GATEWAY_INTERNAL_PORT:-8011}
    depends_on:
      orchestrator:
        condition: service_started
      dashboard-service:
        condition: service_started
    restart: unless-stopped

  dashboard-service:
    image: ghcr.io/mvcrespo/movic-dashboard:latest
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8088}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:8088}
      APPLE_CONNECTOR_URL: ${APPLE_CONNECTOR_URL:-http://apple-connector:8006}
      GOOGLE_CONNECTOR_URL: ${GOOGLE_CONNECTOR_URL:-http://google-connector:8007}
      NOTION_CONNECTOR_URL: ${NOTION_CONNECTOR_URL:-http://notion-connector:8008}
      DISCORD_GATEWAY_URL: ${DISCORD_GATEWAY_URL:-http://gateway:8010}
      TELEGRAM_GATEWAY_URL: ${TELEGRAM_GATEWAY_URL:-http://telegram-gateway:8011}
      CONFIG_POSTGRES_URL: ${CONFIG_POSTGRES_URL:?CONFIG_POSTGRES_URL is required}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      NOTION_WEBHOOK_VERIFICATION_TOKEN: ${NOTION_WEBHOOK_VERIFICATION_TOKEN:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
    depends_on:
      config-postgres:
        condition: service_healthy
      apple-connector:
        condition: service_started
      google-connector:
        condition: service_started
      notion-connector:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      dashboard-service:
        condition: service_started
    restart: unless-stopped

  orchestrator:
    image: ghcr.io/mvcrespo/movic-orchestrator:latest
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8000}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL:-http://llm-service:8001}
      NORMALIZER_SERVICE_URL: ${NORMALIZER_SERVICE_URL:-http://normalizer-service:8002}
      CALENDAR_SERVICE_URL: ${CALENDAR_SERVICE_URL:-http://calendar-service:8003}
      EXTRACTOR_SERVICE_URL: ${EXTRACTOR_SERVICE_URL:-http://extractor-service:8004}
      VALIDATOR_SERVICE_URL: ${VALIDATOR_SERVICE_URL:-http://validator-service:8005}
    depends_on:
      postgres:
        condition: service_healthy
      llm-service:
        condition: service_started
      extractor-service:
        condition: service_started
      validator-service:
        condition: service_started
      normalizer-service:
        condition: service_started
      calendar-service:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  config-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CONFIG_POSTGRES_DB:?CONFIG_POSTGRES_DB is required}
      POSTGRES_USER: ${CONFIG_POSTGRES_USER:?CONFIG_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${CONFIG_POSTGRES_PASSWORD:?CONFIG_POSTGRES_PASSWORD is required}
    volumes:
      - config-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFIG_POSTGRES_USER:?CONFIG_POSTGRES_USER is required} -d ${CONFIG_POSTGRES_DB:?CONFIG_POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  llm-service:
    image: ghcr.io/mvcrespo/movic-llm-service:latest
    build:
      context: .
      dockerfile: llm-service/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LLM_SERVICE_PORT: ${LLM_SERVICE_PORT:-8001}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-true}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  normalizer-service:
    image: ghcr.io/mvcrespo/movic-normalizer-service:latest
    build:
      context: .
      dockerfile: normalizer-service/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NORMALIZER_SERVICE_PORT: ${NORMALIZER_SERVICE_PORT:-8002}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NORMALIZER_MODEL: ${NORMALIZER_MODEL:-qwen2.5:3b}
      NORMALIZER_AUTO_PULL: ${NORMALIZER_AUTO_PULL:-true}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  extractor-service:
    image: ghcr.io/mvcrespo/movic-extractor-service:latest
    build:
      context: .
      dockerfile: extractor-service/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      EXTRACTOR_SERVICE_PORT: ${EXTRACTOR_SERVICE_PORT:-8004}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-qwen2.5:3b}
      EXTRACTOR_AUTO_PULL: ${EXTRACTOR_AUTO_PULL:-true}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  validator-service:
    image: ghcr.io/mvcrespo/movic-validator-service:latest
    build:
      context: .
      dockerfile: validator-service/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VALIDATOR_SERVICE_PORT: ${VALIDATOR_SERVICE_PORT:-8005}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VALIDATOR_MODEL: ${VALIDATOR_MODEL:-qwen2.5:3b}
      VALIDATOR_AUTO_PULL: ${VALIDATOR_AUTO_PULL:-true}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  calendar-service:
    image: ghcr.io/mvcrespo/movic-calendar-service:latest
    build:
      context: .
      dockerfile: calendar-service/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CALENDAR_SERVICE_PORT: ${CALENDAR_SERVICE_PORT:-8003}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      APPLE_CONNECTOR_URL: ${APPLE_CONNECTOR_URL:-http://apple-connector:8006}
      GOOGLE_CONNECTOR_URL: ${GOOGLE_CONNECTOR_URL:-http://google-connector:8007}
      NOTION_CONNECTOR_URL: ${NOTION_CONNECTOR_URL:-http://notion-connector:8008}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
    depends_on:
      postgres:
        condition: service_healthy
      apple-connector:
        condition: service_started
      google-connector:
        condition: service_started
      notion-connector:
        condition: service_started
    restart: unless-stopped

  apple-connector:
    image: ghcr.io/mvcrespo/movic-apple-connector:latest
    build:
      context: .
      dockerfile: apple-connector/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APPLE_CONNECTOR_PORT: ${APPLE_CONNECTOR_PORT:-8006}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      CONFIG_POSTGRES_URL: ${CONFIG_POSTGRES_URL:?CONFIG_POSTGRES_URL is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
      APPLE_CALDAV_URL: ${APPLE_CALDAV_URL:-https://caldav.icloud.com}
      APPLE_SYNC_INTERVAL_MS: ${APPLE_SYNC_INTERVAL_MS:-60000}
      GOOGLE_CONNECTOR_URL: ${GOOGLE_CONNECTOR_URL:-http://google-connector:8007}
      NOTION_CONNECTOR_URL: ${NOTION_CONNECTOR_URL:-http://notion-connector:8008}
    depends_on:
      postgres:
        condition: service_healthy
      config-postgres:
        condition: service_healthy
    restart: unless-stopped

  google-connector:
    image: ghcr.io/mvcrespo/movic-google-connector:latest
    build:
      context: .
      dockerfile: google-connector/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GOOGLE_CONNECTOR_PORT: ${GOOGLE_CONNECTOR_PORT:-8007}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      CONFIG_POSTGRES_URL: ${CONFIG_POSTGRES_URL:?CONFIG_POSTGRES_URL is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_SYNC_INTERVAL_MS: ${GOOGLE_SYNC_INTERVAL_MS:-60000}
      APPLE_CONNECTOR_URL: ${APPLE_CONNECTOR_URL:-http://apple-connector:8006}
      NOTION_CONNECTOR_URL: ${NOTION_CONNECTOR_URL:-http://notion-connector:8008}
    depends_on:
      postgres:
        condition: service_healthy
      config-postgres:
        condition: service_healthy
    restart: unless-stopped

  notion-connector:
    image: ghcr.io/mvcrespo/movic-notion-connector:latest
    build:
      context: .
      dockerfile: notion-connector/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NOTION_CONNECTOR_PORT: ${NOTION_CONNECTOR_PORT:-8008}
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      CONFIG_POSTGRES_URL: ${CONFIG_POSTGRES_URL:?CONFIG_POSTGRES_URL is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      DASHBOARD_INTERNAL_API_TOKEN: ${DASHBOARD_INTERNAL_API_TOKEN:?DASHBOARD_INTERNAL_API_TOKEN is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Lisbon}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI}
      NOTION_API_VERSION: ${NOTION_API_VERSION:-2022-06-28}
      NOTION_SYNC_INTERVAL_MS: ${NOTION_SYNC_INTERVAL_MS:-60000}
      APPLE_CONNECTOR_URL: ${APPLE_CONNECTOR_URL:-http://apple-connector:8006}
      GOOGLE_CONNECTOR_URL: ${GOOGLE_CONNECTOR_URL:-http://google-connector:8007}
    depends_on:
      postgres:
        condition: service_healthy
      config-postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
  postgres-data:
  config-postgres-data:
